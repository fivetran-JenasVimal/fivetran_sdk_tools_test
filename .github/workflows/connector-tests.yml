# Runs pytest for any connector whose PR diff touches a pytest-collectible test
# file (test_*.py / *_test.py). Two jobs: `detect` figures out which connectors
# to test, `tests` actually runs them. Kept as two jobs so `tests` can run (and
# report clearly) even if `detect` itself fails - see the `if: always()` below.
name: Connector Tests

on:
  pull_request:

permissions:
  # Read-only: this workflow only inspects the PR diff and runs tests, it
  # never needs to write to the repo.
  contents: read

env:
  # Minimum line coverage of connector.py (or the connector folder) required to pass.
  COVERAGE_MIN: 50
  # Only a user with triage/write+ access can apply labels to someone else's PR
  # (fork contributors cannot label their own PR), so this label is an
  # effective maintainer-only override. Apply it and re-run to bypass this check.
  OVERRIDE_LABEL: skip-connector-tests

jobs:
  detect:
    name: Detect connectors to test
    runs-on: ubuntu-latest
    outputs:
      # JSON array of connector folder names to test, e.g. ["federal_register"].
      connectors: ${{ steps.find.outputs.connectors }}
      # "true" if a maintainer applied the skip-connector-tests label.
      overridden: ${{ steps.find.outputs.overridden }}

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full git history, not just the latest commit - needed so
          # `git diff base...head` below can find both commits and compare them.
          fetch-depth: 0
          persist-credentials: false

      - name: Find connectors with pytest-collectible tests
        id: find
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          OVERRIDE_LABEL: skip-connector-tests
        run: |
          python3 <<'EOF'
          import json
          import os
          import pathlib
          import subprocess

          # --- Maintainer override: a labelled PR skips this check entirely ---
          labels = json.loads(os.environ["PR_LABELS"] or "[]")
          overridden = os.environ["OVERRIDE_LABEL"] in labels
          if overridden:
              # Only a user with triage/write+ access can label another contributor's
              # PR (fork authors cannot label their own), so this is an effective
              # maintainer-only override.
              print(f"'{os.environ['OVERRIDE_LABEL']}' label present - skipping connector tests.")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
                  out.write("connectors=[]\n")
                  out.write("overridden=true\n")
              raise SystemExit(0)

          def is_pytest_file_name(name):
              # pytest's own default collection rule: test_*.py or *_test.py.
              # No directory-name check (e.g. requiring a "tests/" folder) - a
              # file matching this naming rule counts no matter where it sits,
              # since that's genuinely what pytest itself will collect and run.
              return name.startswith("test_") or name.endswith("_test.py")

          # base/head are the PR's base and head commit SHAs. "..." (triple-dot)
          # diffs head against their common ancestor, which is how GitHub itself
          # computes a PR's file list - so this matches what the PR page shows.
          base = os.environ["BASE_SHA"]
          head = os.environ["HEAD_SHA"]

          # --name-only (no --diff-filter) includes added, modified AND deleted
          # files, so a deleted test file still shows up in this list.
          diff = subprocess.run(
              ["git", "diff", "--name-only", f"{base}...{head}"],
              capture_output=True,
              text=True,
              check=True,
          ).stdout

          changed = set()
          for path in diff.splitlines():
              changed_path = pathlib.PurePosixPath(path)
              parts = changed_path.parts
              # Select only connectors where the changed file itself is pytest-collectible.
              # parts[0] is the top-level connector folder name, e.g.
              # "federal_register" for "federal_register/tests/test_connector.py".
              # len(parts) > 1 excludes files sitting directly in the repo root
              # (those have no connector folder to select).
              # NOTE: a file that was DELETED by this PR no longer exists in the
              # checked-out tree, so pytest can't run it - deleting the only test
              # file a connector has means that connector is never selected here.
              if (
                  len(parts) > 1
                  and not parts[0].startswith(".")
                  and changed_path.suffix == ".py"
                  and is_pytest_file_name(changed_path.name)
              ):
                  changed.add(parts[0])

          selected = sorted(changed)

          print(f"Connectors to test: {selected or 'none'}")

          # GITHUB_OUTPUT: GitHub Actions' mechanism for a step to pass values to
          # later steps/jobs. Writing "key=value" lines here makes them readable
          # as steps.find.outputs.<key> (and, via the job's `outputs:`, as
          # needs.detect.outputs.<key> in the `tests` job below).
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"connectors={json.dumps(selected, separators=(',', ':'))}\n")
              out.write("overridden=false\n")
          EOF

  tests:
    name: Connector tests
    needs: detect
    # Runs even when detect failed or found nothing, so the required check always reports.
    # Without this, a `detect` crash would make GitHub mark `tests` (and the whole
    # required check) as "skipped", which counts as a PASS for merge purposes -
    # that's exactly the gap this `if: always()` closes.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'

      - name: Run tests for each selected connector
        env:
          CONNECTORS: ${{ needs.detect.outputs.connectors }}
          OVERRIDDEN: ${{ needs.detect.outputs.overridden }}
          # needs.<job>.result is GitHub's own verdict on that job: success,
          # failure, cancelled, or skipped. Checked explicitly below because
          # `if: always()` on this job means it runs no matter what detect did -
          # we still need to tell "detect succeeded with an empty list" apart
          # from "detect itself blew up", and fail loudly on the latter.
          DETECT_RESULT: ${{ needs.detect.result }}
          COVERAGE_MIN: ${{ env.COVERAGE_MIN }}
          RUNNER_TEMP_DIR: ${{ runner.temp }}
        run: |
          python3 <<'EOF'
          import json
          import os
          import subprocess
          import sys
          import venv
          import xml.etree.ElementTree as ET
          from pathlib import Path

          # Guard against the "detect crashed" case explained above: fail instead
          # of silently treating a crash the same as "no connectors to test".
          if os.environ["DETECT_RESULT"] != "success":
              print("::error::Detect step did not succeed; cannot tell which connectors to test.")
              sys.exit(1)

          # Maintainer override: detect already set connectors=[] in this case,
          # but we still want a clear, distinct message in the logs for why
          # nothing ran, rather than the generic "nothing changed" message below.
          if os.environ.get("OVERRIDDEN") == "true":
              print("Connector tests skipped: 'skip-connector-tests' label applied by a maintainer.")
              sys.exit(0)

          connectors = json.loads(os.environ["CONNECTORS"] or "[]")
          if not connectors:
              print("No connectors with tests changed. Nothing to run.")
              sys.exit(0)

          # runner.temp: a scratch directory unique to this job run, cleaned up
          # automatically afterward - used below to hold one venv per connector.
          temp = Path(os.environ["RUNNER_TEMP_DIR"])
          coverage_min = os.environ["COVERAGE_MIN"]
          # Maps connector name -> list of human-readable failure reasons, built
          # up across the loop below and used both for the step summary and the
          # final exit-code decision.
          failed = {}

          def skipped_count(junit_path):
              # JUnit XML is the standard machine-readable test report format;
              # pytest writes one here via --junitxml=... below. Each <testsuite>
              # element carries a "skipped" count attribute - sum them up so we
              # can catch skipped tests, which pytest otherwise reports as if
              # they were a kind of pass (exit code 0 either way).
              if not junit_path.is_file():
                  return None
              root = ET.parse(junit_path).getroot()
              return sum(int(suite.get("skipped", 0)) for suite in root.iter("testsuite"))

          for connector in connectors:
              print(f"::group::{connector}")
              reasons = []
              # One venv per connector: requirements pins can conflict across connectors.
              env_dir = temp / f"venv-{connector}"
              venv.create(env_dir, with_pip=True)
              python = env_dir / "bin" / "python"

              requirements = Path(connector, "requirements.txt")
              # fivetran_connector_sdk/requests are pre-installed in the real
              # Connector SDK runtime (per _template_connector/requirements.txt),
              # so contributors' own requirements.txt files don't list them -
              # install them explicitly here to match. pytest/pytest-cov are
              # this workflow's own testing tools, not part of the connector.
              install = [
                  str(python), "-m", "pip", "install",
                  "fivetran_connector_sdk", "requests", "pytest", "pytest-cov",
              ]
              if requirements.is_file():
                  install += ["-r", str(requirements)]

              # check=False lets us capture non-zero exit codes and add clear,
              # connector-specific failure reasons instead of raising immediately.
              if subprocess.run(install, check=False).returncode != 0:
                  reasons.append("dependency install failed")
              else:
                  # Measure coverage of connector.py specifically when it exists
                  # (the SDK's standard entry-point file), otherwise fall back to
                  # the whole connector folder.
                  cov_target = "connector" if Path(connector, "connector.py").is_file() else "."
                  # junit_name is a bare filename, not a path, because the
                  # subprocess below runs with cwd=connector - pytest writes it
                  # relative to that cwd, so `junit` (used to read it back after)
                  # must point at the same place: connector/junit.xml.
                  junit_name = "junit.xml"
                  junit = Path(connector, junit_name)
                  result = subprocess.run(
                      [
                          str(python), "-m", "pytest", ".", "-v",
                          f"--junitxml={junit_name}",
                          f"--cov={cov_target}",
                          "--cov-report=term",
                          # pytest-cov itself fails the run (non-zero exit) if
                          # coverage comes in under this percentage - this is
                          # the guard against tests that pass but exercise
                          # little or none of the actual connector code.
                          f"--cov-fail-under={coverage_min}",
                      ],
                      cwd=connector,
                      # Keep control in this script so we can classify failures
                      # (no tests, test failures, low coverage, missing report).
                      check=False,
                  )
                  if result.returncode == 5:
                      reasons.append("pytest collected no tests (exit code 5)")
                  elif result.returncode != 0:
                      reasons.append(f"pytest exit code {result.returncode} (failed, or coverage below {coverage_min}%)")

                  skipped = skipped_count(junit)
                  if skipped is None:
                      reasons.append("no JUnit report was produced")
                  elif skipped > 0:
                      # pytest writes junit.xml because we pass --junitxml=...; it is a
                      # machine-readable XML report with per-suite test stats.
                      # Skips can happen via @pytest.mark.skip/skipif, missing optional
                      # dependencies/services, or marker deselection. Treat them as
                      # failures so the check is never "green but partially untested".
                      reasons.append(f"{skipped} test(s) skipped; skips are not allowed")
              print("::endgroup::")

              if reasons:
                  failed[connector] = reasons

          # GITHUB_STEP_SUMMARY: a markdown file GitHub renders on the workflow
          # run's summary page - gives a readable pass/fail-per-connector view
          # without having to open each job's raw log.
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as out:
                  out.write("### Connector tests\n\n")
                  for connector in connectors:
                      if connector in failed:
                          out.write(f"- `{connector}`: failed. {'; '.join(failed[connector])}\n")
                      else:
                          out.write(f"- `{connector}`: passed\n")

          # Exiting non-zero here is what actually makes this GitHub Actions
          # step (and so the job, and the PR check) show as failed - everything
          # above just prepared the reporting.
          if failed:
              for connector, reasons in failed.items():
                  print(f"::error::{connector}: {'; '.join(reasons)}")
              sys.exit(1)
          EOF
