name: Connector Tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  detect:
    name: Detect changed connectors with tests
    runs-on: ubuntu-latest
    outputs:
      connectors: ${{ steps.find.outputs.connectors }}

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Find changed connectors that have a tests directory
        id: find
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 <<'EOF'
          import json
          import os
          import pathlib
          import subprocess

          base = os.environ["BASE_SHA"]
          head = os.environ["HEAD_SHA"]

          diff = subprocess.run(
              ["git", "diff", "--name-only", "--diff-filter=ACMR", f"{base}...{head}"],
              capture_output=True,
              text=True,
              check=True,
          ).stdout

          TEST_DIRS = ("tests", "test")
          connectors = set()
          for path in diff.splitlines():
              parts = pathlib.PurePosixPath(path).parts
              if len(parts) < 2 or parts[0].startswith("."):
                  continue
              connector = parts[0]
              if any(pathlib.Path(connector, d).is_dir() for d in TEST_DIRS):
                  connectors.add(connector)

          connectors_json = json.dumps(sorted(connectors), separators=(",", ":"))
          print(f"Connectors to test: {sorted(connectors) or 'none'}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"connectors={connectors_json}\n")
          EOF

  tests:
    name: Connector tests
    needs: detect
    if: needs.detect.outputs.connectors != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'

      - name: Run tests for each changed connector
        env:
          CONNECTORS: ${{ needs.detect.outputs.connectors }}
          RUNNER_TEMP_DIR: ${{ runner.temp }}
        run: |
          python3 <<'EOF'
          import json
          import os
          import subprocess
          import sys
          import venv
          from pathlib import Path

          connectors = json.loads(os.environ["CONNECTORS"])
          temp = Path(os.environ["RUNNER_TEMP_DIR"])
          failed = []

          for connector in connectors:
              print(f"::group::{connector}")
              # One venv per connector: requirements pins can conflict across connectors.
              env_dir = temp / f"venv-{connector}"
              venv.create(env_dir, with_pip=True)
              python = env_dir / "bin" / "python"

              test_dir = next(d for d in ("tests", "test") if Path(connector, d).is_dir())
              requirements = Path(connector, "requirements.txt")
              install = [str(python), "-m", "pip", "install", "fivetran_connector_sdk", "requests", "pytest"]
              if requirements.is_file():
                  install += ["-r", str(requirements)]

              result = subprocess.run(install, check=False)
              if result.returncode == 0:
                  result = subprocess.run(
                      [str(python), "-m", "pytest", f"{test_dir}/", "-v"],
                      cwd=connector,
                      check=False,
                  )
              print("::endgroup::")

              if result.returncode != 0:
                  failed.append(connector)

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as out:
                  out.write("### Connector tests\n\n")
                  for connector in connectors:
                      status = "failed" if connector in failed else "passed"
                      out.write(f"- `{connector}`: {status}\n")

          if failed:
              print(f"Failing connectors: {', '.join(failed)}")
              sys.exit(1)
          EOF
