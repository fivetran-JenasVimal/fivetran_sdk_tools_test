name: Connector PR Comment

on:
  workflow_run:
    workflows: [Connector Tests]
    types: [completed]

permissions:
  actions: read
  pull-requests: write

jobs:
  comment:
    name: Post Connector Test Results
    runs-on: ubuntu-latest
    steps:
      - name: Download PR comment artifact
        id: download_comment
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8218 # v8.0.2
        with:
          name: connector-pr-comment
          path: ${{ runner.temp }}/connector-pr-comment
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Post or update PR comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          COMMENT_PATH: ${{ runner.temp }}/connector-pr-comment/pr_comment.txt
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require("fs");

            const marker = "<!-- connector-test-results -->";
            const run = context.payload.workflow_run;
            const pullRequests = run.pull_requests || [];

            if (run.event !== "pull_request" || pullRequests.length === 0) {
              core.info("No pull request is associated with this workflow run.");
              return;
            }

            const pr = pullRequests[0];
            const issueNumber = pr.number;
            const commentPath = process.env.COMMENT_PATH;

            // Reject results for outdated PR heads: only post if this run's commit
            // matches the PR's current head. Prevents race: slow old run overwrites fast new run.
            if (run.head_sha !== pr.head.sha) {
              core.info(`Skipping stale run: run commit ${run.head_sha} != PR head ${pr.head.sha}`);
              return;
            }

            // Reject results if a newer run exists for this PR (e.g., label-triggered).
            // Prevents label-triggered skip run from being overwritten by original test run.
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "connector-tests.yml",
              per_page: 20,
            });

            const prRuns = runs.data.workflow_runs.filter(r =>
              r.pull_requests?.some(pr_item => pr_item.number === issueNumber)
            );

            if (prRuns.length > 0 && prRuns[0].id !== run.id) {
              core.info(`Skipping: newer run ${prRuns[0].id} exists for PR #${issueNumber}`);
              return;
            }

            // Always produce a comment: either with test results or with run state.
            // Prevents stale results when override label skips run, tests fail, etc.
            const stats = fs.existsSync(commentPath)
              ? fs.readFileSync(commentPath, "utf8")
              : `No connector test report was produced for this run.\n\nWorkflow conclusion: **${run.conclusion || "unknown"}**`;
            if (stats.length > 8192) {
              throw new Error("Connector test comment is too large");
            }

            const body = [
              marker,
              stats,
              "",
              `[Workflow run](${run.html_url})`,
              "",
              "_This comment is auto-updated with every commit._",
            ].join("\n");

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100,
            });

            const existing = comments.find((comment) =>
              comment.user?.login === "github-actions[bot]" && comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body,
              });
            }
