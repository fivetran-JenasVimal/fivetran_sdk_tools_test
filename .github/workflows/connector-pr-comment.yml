name: Connector PR Comment

on:
  workflow_run:
    workflows: [Connector Tests]
    types: [completed]

permissions:
  actions: read
  pull-requests: write

jobs:
  comment:
    name: Post Connector Test Results
    runs-on: ubuntu-latest
    steps:
      - name: Download PR comment artifact
        id: download_comment
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8218 # v8.0.2
        with:
          name: connector-pr-comment
          path: ${{ runner.temp }}/connector-pr-comment
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Post or update PR comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          COMMENT_PATH: ${{ runner.temp }}/connector-pr-comment/pr_comment.txt
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require("fs");

            const marker = "<!-- connector-test-results -->";
            const run = context.payload.workflow_run;
            const pullRequests = run.pull_requests || [];

            if (run.event !== "pull_request" || pullRequests.length === 0) {
              core.info("No pull request is associated with this workflow run.");
              return;
            }

            const pr = pullRequests[0];
            const issueNumber = pr.number;
            const commentPath = process.env.COMMENT_PATH;

            if (!fs.existsSync(commentPath)) {
              core.warning("Connector test comment artifact not found.");
              return;
            }

            const stats = fs.readFileSync(commentPath, "utf8");
            if (stats.length > 8192) {
              throw new Error("Connector test comment is too large");
            }

            const body = [
              marker,
              stats,
              "",
              `[Workflow run](${run.html_url})`,
              "",
              "_This comment is auto-updated with every commit._",
            ].join("\n");

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100,
            });

            const existing = comments.find((comment) =>
              comment.user?.login === "github-actions[bot]" && comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body,
              });
            }
